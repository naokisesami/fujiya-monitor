name: Fujiya Avic Listing Fetcher

on:
  workflow_dispatch:
    inputs:
      url:
        description: "フジヤエービックの商品ページURL"
        required: true
        type: string

permissions:
  contents: write

jobs:
  fetch-listing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch listing data and images
        env:
          FUJIYA_URL: ${{ github.event.inputs.url }}
        run: python fetch_listing.py

      - name: Upload images + data as artifact
        uses: actions/upload-artifact@v4
        with:
          name: fujiya-listing-${{ github.run_number }}
          path: output/
          retention-days: 14

      - name: Commit updated listings.csv
        run: |
          git config user.name "fujiya-monitor-bot"
          git config user.email "actions@github.com"
          git add listings.csv
          git diff --quiet --cached || git commit -m "add listing data [skip ci]"
          git push
